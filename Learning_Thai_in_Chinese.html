  const raw = localStorage.getItem(key);
  if (raw === null) throw new Error("not found: " + key);
  return { key, value: raw };

  try { localStorage.setItem(key, value); } catch (e) { /* private browsing etc */ }
  return { key, value };

function speak(text) {
  try {
    if (typeof window === "undefined" || !window.speechSynthesis) return;
    const clean = text.replace(/ครับ|ค่ะ|คะ/g, "").trim();
    const u = new SpeechSynthesisUtterance(clean || text);
    u.lang = "th-TH";
    u.rate = 0.9;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  } catch (e) {
    /* 靜默失敗：裝置沒有泰文語音時忽略 */
  }
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ---------------------------------------------------------- */
/* 口說練習：麥克風錄音 + 語音辨識文字相似度比對                    */
/* 注意：仰賴瀏覽器內建 Web Speech API（Chrome/Edge 支援較好），      */
/* 辨識過程需要網路連線；量的是「辨識出的文字」跟目標文字的相似度，   */
/* 不是真正的發音準確度，僅供參考。                                 */
/* ---------------------------------------------------------- */

function levenshtein(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      dp[i][j] = a[i - 1] === b[j - 1] ? dp[i - 1][j - 1] : 1 + Math.min(dp[i - 1][j - 1], dp[i][j - 1], dp[i - 1][j]);
    }
  }
  return dp[m][n];
}

function textSimilarity(a, b) {
  const clean = (s) => (s || "").replace(/[\s.,!?？！，。ๆฯๆ]/g, "");
  const s1 = clean(a), s2 = clean(b);
  if (!s1.length && !s2.length) return 100;
  const dist = levenshtein(s1, s2);
  const maxLen = Math.max(s1.length, s2.length) || 1;
  return Math.max(0, Math.round((1 - dist / maxLen) * 100));
}

function speechTier(pct) {
  if (pct >= 80) return { label: "很接近！", color: "text-emerald-600" };
  if (pct >= 55) return { label: "有點像，再練習", color: "text-amber-600" };
  if (pct >= 25) return { label: "差蠻多，再試一次", color: "text-orange-600" };
  return { label: "差很多，慢慢念念看", color: "text-rose-600" };
}

function SpeechPracticeButton({ targetText }) {
  const [supported, setSupported] = useState(true);
  const [state, setState] = useState("idle"); // idle | listening | done | error
  const [result, setResult] = useState(null);
  const [errMsg, setErrMsg] = useState("");

  useEffect(() => {
    const SR = typeof window !== "undefined" && (window.SpeechRecognition || window.webkitSpeechRecognition);
    setSupported(!!SR);
  }, []);

  const start = () => {
    const SR = typeof window !== "undefined" && (window.SpeechRecognition || window.webkitSpeechRecognition);
    if (!SR) {
      setSupported(false);
      return;
    }
    let recog;
    try {
      recog = new SR();
    } catch (e) {
      setState("error");
      setErrMsg("無法啟動語音辨識");
      return;
    }
    recog.lang = "th-TH";
    recog.interimResults = false;
    recog.maxAlternatives = 1;
    setState("listening");
    setResult(null);
    setErrMsg("");
    recog.onresult = (e) => {
      const transcript = e.results[0][0].transcript;
      const pct = textSimilarity(transcript, targetText);
      setResult({ transcript, pct });
      setState("done");
    };
    recog.onerror = (e) => {
      setState("error");
      setErrMsg(e.error === "not-allowed" ? "沒有麥克風權限，請允許存取後再試" : "辨識失敗，再試一次");
    };
    recog.onend = () => setState((s) => (s === "listening" ? "idle" : s));
    try {
      recog.start();
    } catch (e) {
      setState("error");
      setErrMsg("無法啟動錄音");
    }
  };

  if (!supported) {
    return (
      <div className="mt-2 flex flex-col items-center">
        <button disabled className="flex items-center gap-1 text-xs px-3 py-1.5 rounded-full bg-teal-900/40 text-amber-100/30 cursor-not-allowed">

        <p className="text-[10px] text-amber-100/30 mt-1">需要在電腦版 Chrome 或 Edge 環境才能用</p>
      </div>
    );
  }

  return (
    <div className="mt-2 flex flex-col items-center">
      <button
        onClick={start}
        disabled={state === "listening"}
        className="flex items-center gap-1 text-xs px-3 py-1.5 rounded-full bg-rose-600 text-white disabled:opacity-60 active:scale-95 transition"
      >
        <Mic size={12} /> {state === "listening" ? "聆聽中…" : "練習口說"}

      {state === "error" && <p className="text-[11px] text-rose-300 mt-1 text-center max-w-[220px]">{errMsg}</p>}
      {result && (
        <p className={`text-xs mt-1.5 font-medium text-center ${speechTier(result.pct).color}`}>

  );

/* ---------------------------------------------------------- */
/* 手寫評分：canvas 像素比對，離線可用，不需要外部 API              */
/* ---------------------------------------------------------- */

function getAlphaMask(sourceCanvas, threshold) {
  const { width: W, height: H } = sourceCanvas;
  const data = sourceCanvas.getContext("2d").getImageData(0, 0, W, H).data;
  const mask = new Uint8Array(W * H);
  for (let i = 0; i < W * H; i++) mask[i] = data[i * 4 + 3] > threshold ? 1 : 0;
  return mask;
}

function renderGlyphCanvas(ch, W, H, font, blurPx) {
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#000";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = font;
  if (blurPx) ctx.filter = `blur(${blurPx}px)`;
  ctx.fillText(ch, W / 2, H / 2 + H * 0.03);
  return c;
}

function blurredCopy(sourceCanvas, blurPx) {
  const { width: W, height: H } = sourceCanvas;
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const ctx = c.getContext("2d");
  ctx.filter = `blur(${blurPx}px)`;
  ctx.drawImage(sourceCanvas, 0, 0);
  return c;
}

/* 回傳 {pct, coverage, precision} 或 null（畫布幾乎是空的） */
async function scoreHandwriting(drawnCanvas, glyph, font) {
  try { await document.fonts.load(font); } catch (e) {}
  const W = drawnCanvas.width, H = drawnCanvas.height;

  const userSharpMask = getAlphaMask(drawnCanvas, 40);
  let userTotal = 0;
  for (let i = 0; i < userSharpMask.length; i++) if (userSharpMask[i]) userTotal++;
  if (userTotal < 60) return null; // 幾乎沒畫東西

  const targetSharp = renderGlyphCanvas(glyph, W, H, font, 0);
  const targetDilated = renderGlyphCanvas(glyph, W, H, font, 9);
  const userDilated = blurredCopy(drawnCanvas, 9);

  const targetSharpMask = getAlphaMask(targetSharp, 40);
  const targetDilatedMask = getAlphaMask(targetDilated, 20);
  const userDilatedMask = getAlphaMask(userDilated, 20);

  let targetTotal = 0, coverHits = 0, precHits = 0;
  for (let i = 0; i < W * H; i++) {
    if (targetSharpMask[i]) { targetTotal++; if (userDilatedMask[i]) coverHits++; }
    if (userSharpMask[i] && targetDilatedMask[i]) precHits++;
  }
  const coverage = targetTotal ? coverHits / targetTotal : 0;
  const precision = userTotal ? precHits / userTotal : 0;
  const f1 = coverage + precision > 0 ? (2 * coverage * precision) / (coverage + precision) : 0;
  return { pct: Math.round(f1 * 100), coverage: Math.round(coverage * 100), precision: Math.round(precision * 100) };
}

function scoreTier(pct) {
  if (pct >= 75) return { stars: 3, label: "太棒了！筆畫很準", color: "text-emerald-600" };
  if (pct >= 50) return { stars: 2, label: "不錯，再練習會更準", color: "text-amber-600" };
  if (pct >= 25) return { stars: 1, label: "有寫到，但差蠻多", color: "text-orange-600" };
  return { stars: 0, label: "跟目標差很多，再試一次", color: "text-rose-600" };
}

function ScoreResult({ result, checking }) {
  if (checking) return <p className="text-xs text-amber-100/50 mt-3 text-center">評分中…</p>;

  if (result === null) return <p className="text-xs text-amber-100/50 mt-3 text-center">先在畫布上寫寫看，再點檢查</p>;

function TypingTab() {

  const [text, setText] = useState("");
  const [targetIdx, setTargetIdx] = useState(0);
  const target = TARGET_WORDS[targetIdx];
  const matched = text.trim() === target.th;

  const pressKey = (base, shiftChar) => {
    const ch = shiftOn ? shiftChar : base;
    setText((t) => t + ch);
    setPressed(base + shiftChar);
    setTimeout(() => setPressed(null), 150);
  };

  return (
    <div>
      <p className="text-amber-100/80 text-sm leading-relaxed mb-5 max-w-2xl">
        泰國電腦與手機都用「เกษมณี（Kedmanee）」鍵盤配置，一個按鍵藏兩個字：直接按是本字，按住 Shift 是第二個字。
        先點點看下面的鍵盤熟悉位置，之後在系統設定加入泰文輸入法，就能用同一套按鍵配置真正打字。
      </p>

      <div className="flex items-center gap-3 mb-4">
        <button
          onClick={() => setShiftOn((s) => !s)}
          className={`px-4 py-2 rounded-md text-sm font-semibold border transition active:scale-95 ${
            shiftOn ? "bg-amber-400 text-teal-950 border-amber-300" : "bg-teal-900 text-amber-200 border-amber-100/20"
          }`}
        >
          ⇧ Shift {shiftOn ? "開啟" : "關閉"}
        </button>
        <span className="text-xs text-amber-100/50">目前顯示：{shiftOn ? "第二層（Shift）字元" : "第一層字元"}</span>
      </div>

      {/* 鍵盤 */}
      <div className="bg-teal-900/60 border border-amber-100/10 rounded-lg p-3 sm:p-4 space-y-1.5">
        {KB_ROWS.map((row, ri) => (
          <div key={ri} className="flex gap-1.5 overflow-x-auto pb-1">
            {row.map(([qw, base, shiftChar]) => {
              const isActive = pressed === base + shiftChar;
              const shown = shiftOn ? shiftChar : base;
              return (
                <button
                  key={qw}
                  onClick={() => pressKey(base, shiftChar)}
                  className={`shrink-0 w-11 h-14 sm:w-12 sm:h-16 rounded-md flex flex-col items-center justify-center border transition-all duration-150 ${
                    isActive

                  <span className="text-[9px] text-amber-100/40 mt-0.5">{qw}</span>
                </button>
              );
            })}
          </div>
        ))}
        <div className="flex gap-1.5 pt-1">
          <button
            onClick={() => setText((t) => t + " ")}
            className="flex-1 h-10 rounded-md bg-teal-950 border border-amber-100/15 text-amber-100/60 text-xs hover:bg-teal-800 active:scale-95 transition"
          >
            space
          </button>
          <button
            onClick={() => setText((t) => t.slice(0, -1))}
            className="w-16 h-10 rounded-md bg-teal-950 border border-amber-100/15 text-amber-200 flex items-center justify-center hover:bg-teal-800 active:scale-95 transition"

            <Delete size={16} />

            <span className="text-teal-950/50 ml-1">（{target.zh}）</span>

function QuizTab() {
  const [direction, setDirection] = useState("th-zh");

  const buildQ = useCallback(() => {
    const correct = ALL_PHRASES[Math.floor(Math.random() * ALL_PHRASES.length)];
    const distractors = shuffle(ALL_PHRASES.filter((p) => p.id !== correct.id)).slice(0, 3);
    const reverse = direction === "zh-th";
    const options = reverse
      ? shuffle([correct, ...distractors]).map((p) => ({ key: p.id, label: p.th, thai: true }))
      : shuffle([correct, ...distractors]).map((p) => ({ key: p.id, label: p.zh }));
    return { correct, options, reverse };
  }, [direction]);

  const [q, setQ] = useState(buildQ);
  const [picked, setPicked] = useState(null);
  const [score, setScore] = useState({ right: 0, total: 0 });

  const changeDirection = (d) => {
    setDirection(d);
    setPicked(null);
  };
  useEffect(() => { setQ(buildQ()); setPicked(null); }, [direction]);

  const pick = (opt) => {
    if (picked) return;
    setPicked(opt.key);
    setScore((s) => ({ right: s.right + (opt.key === q.correct.id ? 1 : 0), total: s.total + 1 }));
  };

  const next = () => {
    setQ(buildQ());
    setPicked(null);
  };

  return (
    <div className="max-w-md mx-auto">
      <div className="flex items-center justify-center gap-2 mb-5">
        {["th-zh", "zh-th"].map((d) => (
          <button
            key={d}
            onClick={() => changeDirection(d)}
            className={`px-3.5 py-1.5 rounded-full text-xs font-medium transition ${
              direction === d ? "bg-amber-400 text-teal-950" : "bg-teal-900 text-amber-200/70"
            }`}
          >
            {DIRECTION_LABEL[d]}
          </button>
        ))}
      </div>

      <div className="flex items-center justify-between mb-3">
        <p className="text-sm text-amber-100/70">答對 {score.right} / {score.total} 題</p>
        <button onClick={() => setScore({ right: 0, total: 0 })} className="flex items-center gap-1 text-xs text-amber-100/50 underline underline-offset-2">
          <RotateCcw size={12} /> 重設分數
        </button>
      </div>

      <div className="bg-orange-50 rounded-xl border border-amber-800/20 shadow-md p-6 text-center">
        {q.reverse ? (
          <>
            <p className="text-xs text-teal-950/40 mb-2">找出對應的泰文</p>
            <p className="text-2xl font-semibold text-teal-950" style={displayFont}>{q.correct.zh}</p>
          </>
        ) : (
          <>
            <p className="text-xs text-teal-950/40 mb-2">這句泰文是什麼意思？</p>
            <p style={thaiFont} className="text-2xl font-bold text-teal-950 mb-1">{q.correct.th}</p>
            <p style={monoFont} className="text-sm text-emerald-800 mb-1">{q.correct.ro}</p>
          </>
        )}
        <button onClick={() => speak(q.correct.th)} className="inline-flex items-center gap-1 text-xs text-teal-950/50 mt-1">
          <Volume2 size={12} /> 播放
        </button>
      </div>

      <div className="grid grid-cols-1 gap-2 mt-4">
        {q.options.map((opt) => {
          let state = "idle";
          if (picked) {
            if (opt.key === q.correct.id) state = "reveal-correct";
            else if (opt.key === picked) state = "selected-wrong";
            else state = "dimmed";
          }
          return <OptionButton key={opt.key} opt={opt} state={state} onClick={() => pick(opt)} />;
        })}
      </div>

      {picked && (
        <button onClick={next} className="w-full mt-4 py-3 rounded-md bg-amber-400 text-teal-950 font-semibold flex items-center justify-center gap-1 active:scale-95 transition">
          下一題 <ArrowRight size={16} />
        </button>
      )}
    </div>
  );
}

/* ---------------------------------------------------------- */
/* 課程闖關：關卡設計                                            */
/* ---------------------------------------------------------- */

const NON_OBSOLETE_LETTERS = THAI_CONSONANTS.filter((c) => !c.obsolete);
const CLASS_NAME_ZH = { mid: "中音", high: "高音", low: "低音" };

const LETTER_LESSONS = NON_OBSOLETE_LETTERS.map((c) => ({
  id: `l-${c.l}`,
  topic: "letters",
  domain: "letters",
  deep: true,
  unit: c.l,
  sub: `${c.name} · ${CLASS_NAME_ZH[c.cls]}`,
  pool: [c],
}));

const LESSONS = [
  ...LETTER_LESSONS,
  { id: "l-travel1", topic: "travel", domain: "phrase", unit: "旅遊短語 (1/3)", sub: "問候、殺價、點餐", pool: TRAVEL.slice(0, 8) },
  { id: "l-travel2", topic: "travel", domain: "phrase", unit: "旅遊短語 (2/3)", sub: "好吃、問路、機場", pool: TRAVEL.slice(8, 16) },
  { id: "l-travel3", topic: "travel", domain: "phrase", unit: "旅遊短語 (3/3)", sub: "內用外帶、付款", pool: TRAVEL.slice(16, 24) },
  { id: "l-chat1", topic: "chat", domain: "phrase", unit: "聊天用語 (1/2)", sub: "打招呼、自我介紹", pool: CHAT.slice(0, 9) },
  { id: "l-chat2", topic: "chat", domain: "phrase", unit: "聊天用語 (2/2)", sub: "約時間、閒聊", pool: CHAT.slice(9) },
];

const TOPIC_ICON = { letters: PenLine, travel: Plane, chat: MessageCircle };

function pickDistractors(pool, exclude, n) {
  return shuffle(pool.filter((x) => x !== exclude)).slice(0, n);
}

const DIRECTION_LABEL = { "th-zh": "泰 → 中", "zh-th": "中 → 泰", mixed: "混合" };

/* 依方向決定這關會出現哪些題型；規則：泰→中＝題目以泰文（字形／發音）呈現，中→泰＝題目以中文呈現 */
function kindsForLesson(lesson, direction) {
  if (lesson.domain === "letters") {
    if (direction === "th-zh") return ["l_meaning", "l_listen", "l_class"];
    if (direction === "zh-th") return ["l_reverse"];
    return ["l_meaning", "l_listen", "l_class", "l_reverse"];
  }
  if (direction === "th-zh") return ["p_meaning", "p_listen"];
  if (direction === "zh-th") return ["p_reverse", "p_spell"];
  return ["p_meaning", "p_listen", "p_reverse", "p_spell"];
}

/* 單一字母的「深入練習」關卡：固定 5 種角度，含例句，不受方向切換影響 */
const DEEP_LETTER_KINDS = ["l_meaning", "l_listen", "l_class", "l_sentence", "l_reverse"];
function buildDeepQuestions(lesson) {
  const item = lesson.pool[0];
  return DEEP_LETTER_KINDS.map((kind) => buildQuestionForKind(lesson, item, kind));
}

function buildQuestionForKind(lesson, item, kind) {
  if (lesson.domain === "letters") {
    const distractors = pickDistractors(NON_OBSOLETE_LETTERS, item, 3);
    if (kind === "l_meaning") {
      const opts = shuffle([item, ...distractors]).map((c) => ({ key: c.l, label: c.zh }));
      return { kind, item, prompt: { glyph: item.l }, options: opts, correctKey: item.l };
    }
    if (kind === "l_listen") {
      const opts = shuffle([item, ...distractors]).map((c) => ({ key: c.l, label: c.l, glyph: true }));
      return { kind, item, prompt: { audio: item.name }, options: opts, correctKey: item.l };
    }
    if (kind === "l_class") {
      const opts = [
        { key: "mid", label: "中音" }, { key: "high", label: "高音" }, { key: "low", label: "低音" },
      ];
      return { kind, item, prompt: { glyph: item.l }, options: opts, correctKey: item.cls };
    }
    if (kind === "l_sentence") {
      const others = NON_OBSOLETE_LETTERS.filter((c) => c.l !== item.l && c.sent);
      const sentDistractors = shuffle(others).slice(0, 3);
      const opts = shuffle([item, ...sentDistractors]).map((c) => ({ key: c.l, label: c.sent.zh }));
      return { kind, item, prompt: { th: item.sent.th, ro: item.sent.ro }, options: opts, correctKey: item.l };
    }
    // l_reverse
    const opts = shuffle([item, ...distractors]).map((c) => ({ key: c.l, label: c.l, glyph: true }));
    return { kind, item, prompt: { text: item.zh }, options: opts, correctKey: item.l };
  }

  // phrase domain
  const distractors = pickDistractors(ALL_PHRASES, item, 3);
  if (kind === "p_meaning") {
    const opts = shuffle([item, ...distractors]).map((p) => ({ key: p.id, label: p.zh }));
    return { kind, item, prompt: { th: item.th, ro: item.ro }, options: opts, correctKey: item.id };
  }
  if (kind === "p_listen") {
    const opts = shuffle([item, ...distractors]).map((p) => ({ key: p.id, label: p.zh }));
    return { kind, item, prompt: { audio: item.th }, options: opts, correctKey: item.id };
  }
  if (kind === "p_reverse") {
    const opts = shuffle([item, ...distractors]).map((p) => ({ key: p.id, label: p.th, thai: true }));
    return { kind, item, prompt: { text: item.zh }, options: opts, correctKey: item.id };
  }
  // p_spell
  const tokens = item.ro.split(/\s+/).filter(Boolean);
  return { kind, item, prompt: { text: item.zh, audio: item.th }, tiles: shuffle(tokens), correctTiles: tokens };
}

/* 產生單一題目（分組關卡用：依 index 在題型清單裡輪流） */
function buildQuestion(lesson, item, index, direction = "mixed") {
  const kinds = kindsForLesson(lesson, direction);
  const kind = kinds[index % kinds.length];
  return buildQuestionForKind(lesson, item, kind);
}

/* ---------------------------------------------------------- */
/* 選項按鈕                                                     */
/* ---------------------------------------------------------- */

function OptionButton({ opt, state, onClick }) {
  // state: 'idle' | 'selected-correct' | 'selected-wrong' | 'reveal-correct' | 'dimmed'
  let cls = "bg-orange-50 border-amber-800/20 text-teal-950 hover:border-amber-500";
  if (state === "selected-correct" || state === "reveal-correct") cls = "bg-emerald-100 border-emerald-600 text-emerald-900";
  else if (state === "selected-wrong") cls = "bg-rose-100 border-rose-600 text-rose-900";
  else if (state === "dimmed") cls = "bg-orange-50/40 border-amber-800/10 text-teal-950/40";

  return (
    <button
      onClick={onClick}
      className={`w-full flex items-center justify-between gap-2 px-4 py-3 rounded-lg border-2 text-left transition active:scale-[0.98] ${cls}`}
    >
      <span style={opt.glyph || opt.thai ? thaiFont : undefined} className={opt.glyph ? "text-2xl font-semibold" : opt.thai ? "text-lg" : "text-sm font-medium"}>
        {opt.label}
      </span>
      {(state === "selected-correct" || state === "reveal-correct") && <Check size={18} />}
      {state === "selected-wrong" && <X size={18} />}
    </button>
  );
}

/* ---------------------------------------------------------- */
/* 單一關卡遊戲畫面                                              */
/* ---------------------------------------------------------- */

function LessonGame({ lesson, direction, onExit, onComplete }) {
  const questions = useMemo(() => {
    if (lesson.deep) return buildDeepQuestions(lesson);
    const order = shuffle(lesson.pool);
    return order.map((item, i) => buildQuestion(lesson, item, i, direction));
  }, [lesson, direction]);

  const [qIndex, setQIndex] = useState(0);
  const [hearts, setHearts] = useState(3);
  const [selected, setSelected] = useState(null);
  const [tiles, setTiles] = useState([]);
  const [answered, setAnswered] = useState(false);
  const [isCorrect, setIsCorrect] = useState(false);
  const [mistakes, setMistakes] = useState(0);

  const q = questions[qIndex];

  const markResult = (correct) => {
    setAnswered(true);
    setIsCorrect(correct);
    if (!correct) {
      setMistakes((m) => m + 1);
      setHearts((h) => h - 1);
    }
  };

  const handleChoice = (opt) => {
    if (answered) return;
    setSelected(opt.key);
    markResult(opt.key === q.correctKey);
  };

  const addTile = (tok, tokIdx) => {
    if (answered) return;
    setTiles((t) => [...t, { tok, tokIdx }]);
  };
  const removeTile = (i) => {
    if (answered) return;
    setTiles((t) => t.filter((_, idx) => idx !== i));
  };
  const submitSpell = () => {
    if (answered || tiles.length !== q.correctTiles.length) return;
    const built = tiles.map((t) => t.tok).join(" ");
    markResult(built === q.correctTiles.join(" "));
  };

  const handleContinue = () => {
    if (hearts <= 0) { onComplete(false, mistakes); return; }
    if (qIndex + 1 >= questions.length) { onComplete(true, mistakes); return; }
    setQIndex((i) => i + 1);
    setSelected(null);
    setTiles([]);
    setAnswered(false);
    setIsCorrect(false);
  };

  /* 跳過此題：不扣血、不算答錯，給聽不到聲音／沒有麥克風的人一個出路 */
  const handleSkip = () => {
    if (answered) return;
    if (qIndex + 1 >= questions.length) { onComplete(true, mistakes); return; }
    setQIndex((i) => i + 1);
    setSelected(null);
    setTiles([]);
    setAnswered(false);
    setIsCorrect(false);
  };

  const usedTokIdx = new Set(tiles.map((t) => t.tokIdx));

  return (
    <div className="max-w-md mx-auto">
      {/* 頂部：離開、愛心、進度條 */}
      <div className="flex items-center gap-3 mb-5">
        <button onClick={onExit} className="text-amber-100/50 hover:text-amber-100 p-1">
          <X size={20} />
        </button>
        <div className="flex-1 h-2.5 bg-teal-900 rounded-full overflow-hidden">
          <div
            className="h-full bg-amber-400 transition-all duration-300"
            style={{ width: `${(qIndex / questions.length) * 100}%` }}
          />
        </div>
        <div className="flex items-center gap-1 text-rose-400">
          {[0, 1, 2].map((i) => (
            <Heart key={i} size={18} fill={i < hearts ? "currentColor" : "none"} className={i < hearts ? "" : "text-rose-400/30"} />
          ))}
        </div>
      </div>

      {/* 題目卡片 */}
      <div className="bg-orange-50 rounded-xl border border-amber-800/20 shadow-md p-6 text-center min-h-[180px] flex flex-col items-center justify-center">
        {q.prompt.glyph && (
          <>
            <p className="text-xs text-teal-950/40 mb-3">
              {q.kind === "l_class" ? "這個字母屬於哪一類？" : "這個字母代表什麼意思？"}
            </p>
            <p style={thaiFont} className="text-6xl font-bold text-teal-950">{q.prompt.glyph}</p>
          </>
        )}
        {q.prompt.audio && !q.prompt.text && (
          <>
            <p className="text-xs text-teal-950/40 mb-3">聽發音，選出正確答案</p>
            <button onClick={() => speak(q.prompt.audio)} className="p-5 rounded-full bg-teal-950 text-amber-300 active:scale-95 transition">
              <Volume2 size={28} />
            </button>
            {!answered && (
              <button onClick={handleSkip} className="mt-3 text-xs text-teal-950/40 underline underline-offset-2">
                聽不到聲音？跳過這題
              </button>
            )}
          </>
        )}
        {q.prompt.th && (
          <>
            <p className="text-xs text-teal-950/40 mb-2">{q.kind === "l_sentence" ? "這句話是什麼意思？" : "這句泰文是什麼意思？"}</p>
            <p style={thaiFont} className="text-2xl font-bold text-teal-950">{q.prompt.th}</p>
            <p style={monoFont} className="text-sm text-emerald-800 mt-1">{q.prompt.ro}</p>
            <button onClick={() => speak(q.prompt.th)} className="inline-flex items-center gap-1 text-xs text-teal-950/50 mt-2">
              <Volume2 size={12} /> 播放
            </button>
            <SpeechPracticeButton targetText={q.prompt.th} />
          </>
        )}
        {q.prompt.text && q.kind !== "p_spell" && (
          <>
            <p className="text-xs text-teal-950/40 mb-3">找出對應的{lesson.domain === "letters" ? "字母" : "泰文"}</p>
            <p className="text-2xl font-semibold text-teal-950" style={displayFont}>{q.prompt.text}</p>
          </>
        )}
        {q.kind === "p_spell" && (
          <>
            <p className="text-xs text-teal-950/40 mb-2">照順序排出羅馬拼音</p>
            <p className="text-xl font-semibold text-teal-950 mb-1" style={displayFont}>{q.prompt.text}</p>
            <button onClick={() => speak(q.prompt.audio)} className="inline-flex items-center gap-1 text-xs text-teal-950/50">
              <Volume2 size={12} /> 播放
            </button>
          </>
        )}
      </div>

      {/* 拼字答案區（僅 p_spell） */}
      {q.kind === "p_spell" && (
        <div className="mt-4">
          <div className={`min-h-[3rem] rounded-md border-2 px-3 py-2 flex flex-wrap gap-2 items-center ${answered ? (isCorrect ? "border-emerald-600 bg-emerald-50" : "border-rose-600 bg-rose-50") : "border-teal-950/15 bg-white"}`}>
            {tiles.length === 0 && <span style={monoFont} className="text-teal-950/30 text-sm">點下方拼音磚組成正確順序…</span>}
            {tiles.map((t, i) => (
              <button key={i} onClick={() => removeTile(i)} style={monoFont} className="px-3 py-1.5 rounded-md bg-teal-950 text-amber-200 text-sm">
                {t.tok}
              </button>
            ))}
          </div>
          <div className="flex flex-wrap gap-2 mt-3 justify-center">
            {q.tiles.map((tok, i) => (
              <button
                key={i}
                disabled={usedTokIdx.has(i) || answered}
                onClick={() => addTile(tok, i)}
                style={monoFont}
                className={`px-3 py-1.5 rounded-md text-sm border-2 transition ${
                  usedTokIdx.has(i) ? "opacity-0 pointer-events-none" : "bg-orange-50 border-amber-800/20 text-teal-950 active:scale-95"
                }`}
              >
                {tok}
              </button>
            ))}
          </div>
          {!answered && (
            <button
              onClick={submitSpell}
              disabled={tiles.length !== q.correctTiles.length}
              className="w-full mt-4 py-3 rounded-md bg-amber-400 disabled:opacity-30 text-teal-950 font-semibold transition active:scale-95"
            >
              檢查
            </button>
          )}
        </div>
      )}

      {/* 選擇題選項 */}
      {q.kind !== "p_spell" && (
        <div className="grid grid-cols-1 gap-2 mt-4">
          {q.options.map((opt) => {
            let state = "idle";
            if (answered) {
              if (opt.key === q.correctKey) state = "reveal-correct";
              else if (opt.key === selected) state = "selected-wrong";
              else state = "dimmed";
            }
            return <OptionButton key={opt.key} opt={opt} state={state} onClick={() => handleChoice(opt)} />;
          })}
        </div>
      )}

      {/* 回饋 + 繼續 */}
      {answered && (
        <div className="mt-4">
          <p className={`text-sm font-medium flex items-center gap-1.5 ${isCorrect ? "text-emerald-300" : "text-rose-300"}`}>
            {isCorrect ? <><Check size={16} /> 答對了！</> : <><X size={16} /> 答錯了{q.kind === "p_spell" ? `，正確順序：${q.correctTiles.join(" ")}` : ""}</>}
          </p>
          <button onClick={handleContinue} className="w-full mt-2 py-3 rounded-md bg-amber-400 text-teal-950 font-semibold flex items-center justify-center gap-1 active:scale-95 transition">
            {hearts <= 0 ? "查看結果" : qIndex + 1 >= questions.length ? "完成關卡" : "繼續"} <ArrowRight size={16} />
          </button>
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------- */
/* 關卡結果畫面                                                  */
/* ---------------------------------------------------------- */

function ResultScreen({ success, mistakes, xpEarned, streak, onDone }) {
  return (
    <div className="max-w-md mx-auto text-center py-10">
      <div className={`w-20 h-20 rounded-full mx-auto flex items-center justify-center mb-5 ${success ? "bg-amber-400 text-teal-950" : "bg-teal-900 text-amber-200/50"}`}>
        {success ? <Trophy size={36} /> : <Heart size={36} />}
      </div>
      <h2 style={displayFont} className="text-2xl font-bold text-orange-50 mb-1">
        {success ? "關卡完成！" : "愛心用完了"}
      </h2>
      <p className="text-amber-100/60 text-sm mb-6">
        {success ? (mistakes === 0 ? "全對，完美通關！" : `完成，答錯了 ${mistakes} 題`) : "別氣餒，再試一次就好"}
      </p>

      {success && (
        <div className="flex items-center justify-center gap-6 mb-8">
          <div className="flex items-center gap-1.5 text-amber-300">
            <Zap size={20} /> <span className="font-semibold">+{xpEarned} XP</span>
          </div>
          <div className="flex items-center gap-1.5 text-orange-400">
            <Flame size={20} /> <span className="font-semibold">{streak} 天連續</span>
          </div>
        </div>
      )}

      <button onClick={onDone} className="px-8 py-3 rounded-full bg-amber-400 text-teal-950 font-semibold active:scale-95 transition">
        {success ? "回到課程地圖" : "重新挑戰"}
      </button>
    </div>
  );
}

/* ---------------------------------------------------------- */
/* 課程地圖                                                     */
/* ---------------------------------------------------------- */

function LessonNode({ lesson, index, status, onClick }) {
  const Icon = TOPIC_ICON[lesson.topic];
  const offset = index % 3 === 1 ? "translate-x-8" : index % 3 === 2 ? "-translate-x-8" : "";

  let circleCls = "bg-teal-900 text-amber-100/20 border-amber-100/10";
  if (status === "current") circleCls = "bg-amber-400 text-teal-950 border-amber-300 shadow-[0_0_0_6px_rgba(251,191,36,0.15)]";
  else if (status === "done") circleCls = "bg-emerald-600 text-white border-emerald-500";

  return (
    <div className={`relative flex flex-col items-center ${offset}`}>
      <button
        onClick={onClick}
        disabled={status === "locked"}
        className={`w-16 h-16 rounded-full border-4 flex items-center justify-center transition active:scale-95 ${circleCls} ${status === "locked" ? "cursor-not-allowed" : ""}`}
      >
        {status === "locked" ? (
          <Lock size={22} />
        ) : status === "done" ? (
          <Check size={26} />
        ) : lesson.topic === "letters" ? (
          <span style={thaiFont} className="text-2xl font-bold">{lesson.pool[0].l}</span>
        ) : (
          <Icon size={24} />
        )}
      </button>
      <p className="text-xs text-amber-100/60 mt-2 text-center max-w-[6.5rem] leading-tight">{lesson.unit}</p>
      <p className="text-[10px] text-amber-100/30 text-center max-w-[6.5rem] leading-tight">{lesson.sub}</p>
    </div>
  );
}

function LessonsTab() {
  const [completed, setCompleted] = useState(new Set());
  const [xp, setXp] = useState(0);
  const [streak, setStreak] = useState(0);
  const [direction, setDirection] = useState("mixed");
  const [activeLessonId, setActiveLessonId] = useState(null);
  const [result, setResult] = useState(null); // { success, mistakes, xpEarned }

  useEffect(() => {
    (async () => {
      try {
        const r = await storageGet("lesson-progress");
        if (r?.value) setCompleted(new Set(JSON.parse(r.value)));
      } catch (e) {}
      try {
        const r2 = await storageGet("xp-streak");
        if (r2?.value) {
          const d = JSON.parse(r2.value);
          setXp(d.xp || 0);
          setStreak(d.streak || 0);
        }
      } catch (e) {}
      try {
        const r3 = await storageGet("lesson-direction");
        if (r3?.value) setDirection(r3.value);
      } catch (e) {}
    })();
  }, []);

  const changeDirection = (d) => {
    setDirection(d);
    (async () => { try { await storageSet("lesson-direction", d); } catch (e) {} })();
  };

  const activeLesson = LESSONS.find((l) => l.id === activeLessonId);

  const handleComplete = async (success, mistakes) => {
    if (!success) {
      setResult({ success: false, mistakes, xpEarned: 0 });
      return;
    }
    const earned = mistakes === 0 ? 15 : 10;
    const newCompleted = new Set(completed);
    newCompleted.add(activeLessonId);

    const today = new Date().toISOString().slice(0, 10);
    let newStreak = streak;
    try {
      const r = await storageGet("xp-streak");
      const prev = r?.value ? JSON.parse(r.value) : { xp: 0, streak: 0, last: null };
      if (prev.last === today) newStreak = prev.streak || streak;
      else if (prev.last) {
        const diffDays = Math.round((new Date(today) - new Date(prev.last)) / 86400000);
        newStreak = diffDays === 1 ? (prev.streak || 0) + 1 : 1;
      } else {
        newStreak = 1;
      }
      const newXp = (prev.xp || 0) + earned;
      await storageSet("xp-streak", JSON.stringify({ xp: newXp, streak: newStreak, last: today }));
      setXp(newXp);
    } catch (e) {
      setXp((x) => x + earned);
      newStreak = streak || 1;
    }
    setStreak(newStreak);
    setCompleted(newCompleted);
    try { await storageSet("lesson-progress", JSON.stringify([...newCompleted])); } catch (e) {}

    setResult({ success: true, mistakes, xpEarned: earned, streak: newStreak });
  };

  if (activeLesson && !result) {
    return (
      <LessonGame
        lesson={activeLesson}
        direction={direction}
        onExit={() => setActiveLessonId(null)}
        onComplete={handleComplete}
      />
    );
  }

  if (result) {
    return (
      <ResultScreen
        success={result.success}
        mistakes={result.mistakes}
        xpEarned={result.xpEarned}
        streak={result.streak || streak}
        onDone={() => { setResult(null); setActiveLessonId(null); }}
      />
    );
  }

  return (
    <div>
      <div className="flex items-center justify-center gap-6 mb-5">
        <div className="flex items-center gap-1.5 text-amber-300">
          <Zap size={18} /> <span className="font-semibold text-sm">{xp} XP</span>
        </div>
        <div className="flex items-center gap-1.5 text-orange-400">
          <Flame size={18} /> <span className="font-semibold text-sm">{streak} 天連續</span>
        </div>
      </div>

      <div className="flex items-center justify-center gap-2 mb-8">
        {["th-zh", "zh-th", "mixed"].map((d) => (
          <button
            key={d}
            onClick={() => changeDirection(d)}
            className={`px-3.5 py-1.5 rounded-full text-xs font-medium transition ${
              direction === d ? "bg-amber-400 text-teal-950" : "bg-teal-900 text-amber-200/70"
            }`}
          >
            {DIRECTION_LABEL[d]}
          </button>
        ))}
      </div>

      <div className="relative flex flex-col items-center gap-8 max-w-xs mx-auto">
        <div className="absolute top-0 bottom-0 left-1/2 w-0.5 bg-amber-100/10 -z-10" />
        {LESSONS.map((lesson, i) => {
          const status = completed.has(lesson.id) ? "done" : (i === 0 || completed.has(LESSONS[i - 1].id)) ? "current" : "locked";
          return (
            <LessonNode
              key={lesson.id}
              lesson={lesson}
              index={i}
              status={status}
              onClick={() => status !== "locked" && setActiveLessonId(lesson.id)}
            />
          );
        })}
      </div>
    </div>
  );
}

/* 主元件                                                      */

const TABS = [
  { id: "lessons", label: "課程闖關", icon: Trophy },
  { id: "write", label: "字母手寫", icon: PenLine },
  { id: "type", label: "打字入門", icon: Keyboard },
  { id: "travel", label: "旅遊短語", icon: Plane },
  { id: "chat", label: "聊天用語", icon: MessageCircle },
  { id: "quiz", label: "測驗練習", icon: GraduationCap },
];

function ThaiTravelChat() {
  const [tab, setTab] = useState("lessons");
  const [known, setKnown] = useState(new Set());
  const [knownLetters, setKnownLetters] = useState(new Set());

  useEffect(() => {
    (async () => {
      try {
        const res = await storageGet("known-phrases");
        if (res?.value) setKnown(new Set(JSON.parse(res.value)));
      } catch (e) {}
      try {
        const res2 = await storageGet("known-letters");
        if (res2?.value) setKnownLetters(new Set(JSON.parse(res2.value)));
      } catch (e) {}
    })();
  }, []);

  const toggleKnown = async (id) => {
    setKnown((prev) => {
      const next = new Set(prev);
      next.has(id) ? next.delete(id) : next.add(id);
      (async () => {
        try { await storageSet("known-phrases", JSON.stringify([...next])); } catch (e) {}
      })();
      return next;
    });
  };

  const toggleKnownLetter = async (id) => {
    setKnownLetters((prev) => {
      const next = new Set(prev);
      next.has(id) ? next.delete(id) : next.add(id);
      (async () => {
        try { await storageSet("known-letters", JSON.stringify([...next])); } catch (e) {}
      })();
      return next;
    });
  };

  return (
    <div className="min-h-screen bg-teal-950" style={thaiFont}>
      {/* Header：路線牌風格 */}
      <div className="border-b border-amber-100/10 px-5 pt-8 pb-4">
        <p className="text-amber-400 text-xs tracking-[0.3em] uppercase mb-1" style={monoFont}>Kedmanee · Travel · Chat</p>
        <h1 style={displayFont} className="text-3xl font-black text-orange-50">背包泰語</h1>
        <p className="text-amber-100/60 text-sm mt-1">課程闖關・字母手寫・打字入門・旅遊短語・聊天用語，一站練到會</p>
      </div>

      {/* Tabs：站牌式導覽 */}
      <div className="sticky top-0 z-10 bg-teal-950/95 backdrop-blur border-b border-amber-100/10 px-3 py-2 overflow-x-auto">
        <div className="flex gap-2 min-w-max">
          {TABS.map(({ id, label, icon: Icon }) => (
            <button
              key={id}
              onClick={() => setTab(id)}
              className={`flex items-center gap-1.5 px-4 py-2 rounded-full text-sm font-medium transition ${
                tab === id ? "bg-amber-400 text-teal-950" : "text-amber-100/60 hover:text-amber-100"
              }`}
            >
              <Icon size={15} /> {label}
            </button>
          ))}
        </div>
      </div>

      <div className="px-5 py-6 max-w-3xl mx-auto">
        {tab === "lessons" && <LessonsTab />}
        {tab === "write" && <LetterWritingTab known={knownLetters} onToggleKnown={toggleKnownLetter} />}
        {tab === "type" && <TypingTab />}
        {tab === "travel" && (
          <PhraseGrid
            list={TRAVEL}
            known={known}
            onToggleKnown={toggleKnown}
            note="男生說話用「ครับ」結尾，女生用「ค่ะ」／問句用「คะ」，禮貌又自然。"
          />
        )}
        {tab === "chat" && <PhraseGrid list={CHAT} known={known} onToggleKnown={toggleKnown} />}
        {tab === "quiz" && <QuizSection known={known} onToggleKnown={toggleKnown} />}
      </div>

      <div className="px-5 pb-8 pt-2 max-w-3xl mx-auto">
        <p className="text-xs text-amber-100/30">星星圖示可標記已學會的句子，會自動記住進度。發音播放取決於裝置是否內建泰文語音，沒聲音時可對照羅馬拼音練習，聽力題也可以點「跳過這題」略過、不扣血。「練習口說」需要麥克風權限、網路連線，且電腦版 Chrome / Edge 支援較好，其他瀏覽器會顯示為停用；分數是比對「辨識到的文字」跟目標句子的相似度，僅供參考，不是精準的發音評分。</p>
      </div>
    </div>
  );
}
