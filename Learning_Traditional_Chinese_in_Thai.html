  const raw = localStorage.getItem(key);
  if (raw === null) throw new Error("not found: " + key);
  return { key, value: raw };
}
function storageSet(key, value) {

  return { key, value };
}

function speak(text) {
  try {
    if (typeof window === "undefined" || !window.speechSynthesis) return;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-TW";
    u.rate = 0.9;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  } catch (e) {}
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ---------------------------------------------------------- */
/* ฝึกพูด: อัดเสียง + เทียบข้อความที่ระบบถอดเสียงได้กับประโยคเป้าหมาย   */
/* ใช้ Web Speech API ของเบราว์เซอร์ (รองรับดีที่สุดใน Chrome/Edge)   */
/* ต้องต่อเน็ตตอนถอดเสียง คะแนนวัดความ "ใกล้เคียงของข้อความที่ได้ยิน" */
/* ไม่ใช่คะแนนความแม่นยำของการออกเสียงจริง ๆ ใช้เป็นแนวทางคร่าว ๆ     */
/* ---------------------------------------------------------- */

function levenshtein(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      dp[i][j] = a[i - 1] === b[j - 1] ? dp[i - 1][j - 1] : 1 + Math.min(dp[i - 1][j - 1], dp[i][j - 1], dp[i - 1][j]);
    }
  }
  return dp[m][n];
}

function textSimilarity(a, b) {
  const clean = (s) => (s || "").replace(/[\s.,!?？！，。]/g, "");
  const s1 = clean(a), s2 = clean(b);
  if (!s1.length && !s2.length) return 100;
  const dist = levenshtein(s1, s2);
  const maxLen = Math.max(s1.length, s2.length) || 1;
  return Math.max(0, Math.round((1 - dist / maxLen) * 100));
}

function speechTier(pct) {
  if (pct >= 80) return { label: "ใกล้เคียงมาก!", color: "text-emerald-600" };
  if (pct >= 55) return { label: "ใกล้เคียง ฝึกอีกหน่อย", color: "text-amber-600" };
  if (pct >= 25) return { label: "ยังต่างอยู่ ลองใหม่", color: "text-orange-600" };
  return { label: "ต่างเยอะ ลองพูดช้า ๆ ดู", color: "text-rose-600" };
}

function SpeechPracticeButton({ targetText }) {
  const [supported, setSupported] = useState(true);
  const [state, setState] = useState("idle");
  const [result, setResult] = useState(null);
  const [errMsg, setErrMsg] = useState("");

  useEffect(() => {
    const SR = typeof window !== "undefined" && (window.SpeechRecognition || window.webkitSpeechRecognition);
    setSupported(!!SR);
  }, []);

  const start = () => {
    const SR = typeof window !== "undefined" && (window.SpeechRecognition || window.webkitSpeechRecognition);
    if (!SR) {
      setSupported(false);
      return;
    }
    let recog;
    try {
      recog = new SR();
    } catch (e) {
      setState("error");
      setErrMsg("เปิดใช้งานไม่ได้");
      return;
    }
    recog.lang = "zh-TW";
    recog.interimResults = false;
    recog.maxAlternatives = 1;
    setState("listening");
    setResult(null);
    setErrMsg("");
    recog.onresult = (e) => {
      const transcript = e.results[0][0].transcript;
      const pct = textSimilarity(transcript, targetText);
      setResult({ transcript, pct });
      setState("done");
    };
    recog.onerror = (e) => {
      setState("error");
      setErrMsg(e.error === "not-allowed" ? "ไม่ได้รับอนุญาตใช้ไมโครโฟน กรุณาอนุญาตแล้วลองใหม่" : "ถอดเสียงไม่สำเร็จ ลองใหม่อีกครั้ง");
    };
    recog.onend = () => setState((s) => (s === "listening" ? "idle" : s));
    try {
      recog.start();
    } catch (e) {
      setState("error");
      setErrMsg("เริ่มอัดเสียงไม่ได้");
    }
  };

  if (!supported) {
    return (
      <div className="mt-2 flex flex-col items-center">
        <button disabled style={thaiFont} className="flex items-center gap-1 text-xs px-3 py-1.5 rounded-full bg-teal-900/40 text-amber-100/30 cursor-not-allowed">
          <Mic size={12} /> ฝึกพูด（เบราว์เซอร์นี้ไม่รองรับ）
        </button>
        <p style={thaiFont} className="text-[10px] text-amber-100/30 mt-1">ต้องใช้ Chrome หรือ Edge บนคอมพิวเตอร์เท่านั้น</p>
      </div>
    );
  }

  return (
    <div className="mt-2 flex flex-col items-center">
      <button
        onClick={start}
        disabled={state === "listening"}
        className="flex items-center gap-1 text-xs px-3 py-1.5 rounded-full bg-rose-600 text-white disabled:opacity-60 active:scale-95 transition"
      >
        <Mic size={12} /> {state === "listening" ? "กำลังฟัง…" : "ฝึกพูด"}
      </button>
      {state === "error" && <p style={thaiFont} className="text-[11px] text-rose-300 mt-1 text-center max-w-[220px]">{errMsg}</p>}
      {result && (
        <p style={thaiFont} className={`text-xs mt-1.5 font-medium text-center ${speechTier(result.pct).color}`}>
          คุณพูดว่า「{result.transcript || "（ไม่ได้ยิน）"}」・ใกล้เคียง {result.pct}%・{speechTier(result.pct).label}
        </p>
      )}
    </div>
  );
}

/* ---------------------------------------------------------- */

/* ---------------------------------------------------------- */
/* ให้คะแนนลายมือ: เทียบพิกเซลบน canvas ใช้งานได้แบบออฟไลน์ ไม่ต้องพึ่ง API ภายนอก */
/* ---------------------------------------------------------- */

function getAlphaMask(sourceCanvas, threshold) {
  const { width: W, height: H } = sourceCanvas;
  const data = sourceCanvas.getContext("2d").getImageData(0, 0, W, H).data;
  const mask = new Uint8Array(W * H);
  for (let i = 0; i < W * H; i++) mask[i] = data[i * 4 + 3] > threshold ? 1 : 0;
  return mask;
}

function renderGlyphCanvas(ch, W, H, font, blurPx) {
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#000";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = font;
  if (blurPx) ctx.filter = `blur(${blurPx}px)`;
  ctx.fillText(ch, W / 2, H / 2 + H * 0.03);
  return c;
}

function blurredCopy(sourceCanvas, blurPx) {
  const { width: W, height: H } = sourceCanvas;
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const ctx = c.getContext("2d");
  ctx.filter = `blur(${blurPx}px)`;
  ctx.drawImage(sourceCanvas, 0, 0);
  return c;
}

async function scoreHandwriting(drawnCanvas, glyph, font) {
  try { await document.fonts.load(font); } catch (e) {}
  const W = drawnCanvas.width, H = drawnCanvas.height;

  const userSharpMask = getAlphaMask(drawnCanvas, 40);
  let userTotal = 0;
  for (let i = 0; i < userSharpMask.length; i++) if (userSharpMask[i]) userTotal++;
  if (userTotal < 60) return null;

  const targetSharp = renderGlyphCanvas(glyph, W, H, font, 0);
  const targetDilated = renderGlyphCanvas(glyph, W, H, font, 9);
  const userDilated = blurredCopy(drawnCanvas, 9);

  const targetSharpMask = getAlphaMask(targetSharp, 40);
  const targetDilatedMask = getAlphaMask(targetDilated, 20);
  const userDilatedMask = getAlphaMask(userDilated, 20);

  let targetTotal = 0, coverHits = 0, precHits = 0;
  for (let i = 0; i < W * H; i++) {
    if (targetSharpMask[i]) { targetTotal++; if (userDilatedMask[i]) coverHits++; }
    if (userSharpMask[i] && targetDilatedMask[i]) precHits++;
  }
  const coverage = targetTotal ? coverHits / targetTotal : 0;
  const precision = userTotal ? precHits / userTotal : 0;
  const f1 = coverage + precision > 0 ? (2 * coverage * precision) / (coverage + precision) : 0;
  return { pct: Math.round(f1 * 100), coverage: Math.round(coverage * 100), precision: Math.round(precision * 100) };
}

function scoreTier(pct) {
  if (pct >= 75) return { stars: 3, label: "เยี่ยมมาก! ตรงเป๊ะ", color: "text-emerald-600" };
  if (pct >= 50) return { stars: 2, label: "ดีนะ ฝึกอีกหน่อยจะแม่นขึ้น", color: "text-amber-600" };
  if (pct >= 25) return { stars: 1, label: "เขียนมาแล้ว แต่ยังเพี้ยนอยู่", color: "text-orange-600" };
  return { stars: 0, label: "ยังไม่ตรงเลย ลองใหม่อีกครั้ง", color: "text-rose-600" };
}

      <p style={thaiFont} className="text-[11px] text-teal-950/40 mt-0.5">ครอบคลุม {result.coverage}% · แม่นยำ {result.precision}%</p>

  const pool = CHARACTERS.filter((c) => filter === "all" || c.group === filter);

  useEffect(() => setIdx(0), [filter]);

  const clearCanvas = useCallback(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    canvas.getContext("2d").clearRect(0, 0, canvas.width, canvas.height);
    setScore(undefined);
  }, []);
  useEffect(() => { clearCanvas(); }, [ch?.c, clearCanvas]);

  const checkScore = async () => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    setChecking(true);
    const result = await scoreHandwriting(canvas, ch.c, `700 220px 'Noto Serif TC', serif`);
    setScore(result);
    setChecking(false);
  };

  const getPos = (e, canvas) => {
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  };
  const startDraw = (e) => {
    const canvas = canvasRef.current;
    canvas.setPointerCapture(e.pointerId);

    const { x, y } = getPos(e, canvas);
    ctx.beginPath(); ctx.moveTo(x, y);
    ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.lineWidth = 7; ctx.strokeStyle = "#134e4a";
    drawingRef.current = true;
  };
  const moveDraw = (e) => {
    if (!drawingRef.current) return;
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    const { x, y } = getPos(e, canvas);
    ctx.lineTo(x, y); ctx.stroke();

            {label}

      </div>
      <div className="bg-orange-50 rounded-xl border border-amber-800/20 shadow-md p-6 text-center">
        {q.reverse ? (

            <p style={monoFont} className="text-sm text-emerald-800 mb-1">{q.correct.py}</p>

        <button onClick={() => speak(q.correct.zh)} className="inline-flex items-center gap-1 text-xs text-teal-950/50 mt-1"><Volume2 size={12} /> เล่นเสียง</button>
      </div>
      <div className="grid grid-cols-1 gap-2 mt-4">
        {q.options.map((opt) => {

const CLASS_NAME_TH = { easy: "ง่าย", medium: "กลาง", hard: "ยาก" };

const CHAR_LESSONS = CHARACTERS.map((c) => ({
  id: `l-${c.c}`,
  topic: "char",
  domain: "char",
  deep: true,
  unit: c.c,
  sub: `${c.py} · ${CLASS_NAME_TH[c.group]}`,
  pool: [c],
}));

const LESSONS = [
  ...CHAR_LESSONS,
  { id: "l-travel1", topic: "travel", domain: "phrase", unit: "ท่องเที่ยว (1/3)", sub: "ทักทาย ต่อรองราคา", pool: TRAVEL.slice(0, 8) },
  { id: "l-travel2", topic: "travel", domain: "phrase", unit: "ท่องเที่ยว (2/3)", sub: "อาหาร ถามทาง", pool: TRAVEL.slice(8, 16) },
  { id: "l-travel3", topic: "travel", domain: "phrase", unit: "ท่องเที่ยว (3/3)", sub: "ทานที่นี่/ห่อกลับ จ่ายเงิน", pool: TRAVEL.slice(16, 24) },
  { id: "l-chat1", topic: "chat", domain: "phrase", unit: "บทสนทนา (1/2)", sub: "ทักทาย แนะนำตัว", pool: CHAT.slice(0, 9) },
  { id: "l-chat2", topic: "chat", domain: "phrase", unit: "บทสนทนา (2/2)", sub: "นัดเวลา พูดคุยเล่น", pool: CHAT.slice(9) },
];

const TOPIC_ICON = { char: PenLine, travel: Plane, chat: MessageCircle };
const LESSON_DIRECTION_LABEL = { "zh-th": "จีน → ไทย", "th-zh": "ไทย → จีน", mixed: "ผสม" };

function pickDistractors(pool, exclude, n) { return shuffle(pool.filter((x) => x !== exclude)).slice(0, n); }

function kindsForLesson(lesson, direction) {
  if (lesson.domain === "char") {
    if (direction === "zh-th") return ["c_meaning", "c_listen"];
    if (direction === "th-zh") return ["c_reverse"];
    return ["c_meaning", "c_listen", "c_reverse"];
  }
  if (direction === "zh-th") return ["p_meaning", "p_listen"];
  if (direction === "th-zh") return ["p_reverse", "p_spell"];
  return ["p_meaning", "p_listen", "p_reverse", "p_spell"];
}

/* 單一漢字的「深入練習」關卡：固定 4 種角度，含例句，不受方向切換影響 */
const DEEP_CHAR_KINDS = ["c_meaning", "c_listen", "c_sentence", "c_reverse"];
function buildDeepQuestions(lesson) {
  const item = lesson.pool[0];
  return DEEP_CHAR_KINDS.map((kind) => buildQuestionForKind(lesson, item, kind));
}

function buildQuestionForKind(lesson, item, kind) {
  if (lesson.domain === "char") {
    const distractors = pickDistractors(CHARACTERS, item, 3);
    if (kind === "c_meaning") {
      const opts = shuffle([item, ...distractors]).map((c) => ({ key: c.c, label: c.th }));
      return { kind, item, prompt: { glyph: item.c }, options: opts, correctKey: item.c };
    }
    if (kind === "c_listen") {
      const opts = shuffle([item, ...distractors]).map((c) => ({ key: c.c, label: c.c, big: true }));
      return { kind, item, prompt: { audio: item.c }, options: opts, correctKey: item.c };
    }
    if (kind === "c_sentence") {
      const others = CHARACTERS.filter((c) => c.c !== item.c && c.sent);
      const sentDistractors = shuffle(others).slice(0, 3);
      const opts = shuffle([item, ...sentDistractors]).map((c) => ({ key: c.c, label: c.sent.th }));
      return { kind, item, prompt: { zh: item.sent.zh, py: item.sent.py }, options: opts, correctKey: item.c };
    }
    const opts = shuffle([item, ...distractors]).map((c) => ({ key: c.c, label: c.c, big: true }));
    return { kind, item, prompt: { text: item.th }, options: opts, correctKey: item.c };
  }

  const distractors = pickDistractors(ALL_PHRASES, item, 3);
  if (kind === "p_meaning") {
    const opts = shuffle([item, ...distractors]).map((p) => ({ key: p.id, label: p.th }));
    return { kind, item, prompt: { zh: item.zh, py: item.py }, options: opts, correctKey: item.id };
  }
  if (kind === "p_listen") {
    const opts = shuffle([item, ...distractors]).map((p) => ({ key: p.id, label: p.th }));
    return { kind, item, prompt: { audio: item.zh }, options: opts, correctKey: item.id };
  }
  if (kind === "p_reverse") {
    const opts = shuffle([item, ...distractors]).map((p) => ({ key: p.id, label: p.zh, big: true }));
    return { kind, item, prompt: { text: item.th }, options: opts, correctKey: item.id };
  }
  const tokens = item.py.replace(/[?？]/g, "").split(/\s+/).filter(Boolean);
  return { kind, item, prompt: { text: item.th, audio: item.zh }, tiles: shuffle(tokens), correctTiles: tokens };
}

/* 產生單一題目（分組關卡用：依 index 在題型清單裡輪流） */
function buildQuestion(lesson, item, index, direction = "mixed") {
  const kinds = kindsForLesson(lesson, direction);
  const kind = kinds[index % kinds.length];
  return buildQuestionForKind(lesson, item, kind);
}

function LessonGame({ lesson, direction, onExit, onComplete }) {
  const questions = useMemo(() => {
    if (lesson.deep) return buildDeepQuestions(lesson);
    const order = shuffle(lesson.pool);
    return order.map((item, i) => buildQuestion(lesson, item, i, direction));
  }, [lesson, direction]);

  const [qIndex, setQIndex] = useState(0);
  const [hearts, setHearts] = useState(3);
  const [selected, setSelected] = useState(null);
  const [tiles, setTiles] = useState([]);
  const [answered, setAnswered] = useState(false);
  const [isCorrect, setIsCorrect] = useState(false);
  const [mistakes, setMistakes] = useState(0);
  const q = questions[qIndex];

  const markResult = (correct) => {
    setAnswered(true); setIsCorrect(correct);
    if (!correct) { setMistakes((m) => m + 1); setHearts((h) => h - 1); }
  };
  const handleChoice = (opt) => { if (answered) return; setSelected(opt.key); markResult(opt.key === q.correctKey); };
  const addTile = (tok, tokIdx) => { if (answered) return; setTiles((t) => [...t, { tok, tokIdx }]); };
  const removeTile = (i) => { if (answered) return; setTiles((t) => t.filter((_, idx) => idx !== i)); };
  const submitSpell = () => {
    if (answered || tiles.length !== q.correctTiles.length) return;
    markResult(tiles.map((t) => t.tok).join(" ") === q.correctTiles.join(" "));
  };
  const handleContinue = () => {
    if (hearts <= 0) { onComplete(false, mistakes); return; }
    if (qIndex + 1 >= questions.length) { onComplete(true, mistakes); return; }
    setQIndex((i) => i + 1); setSelected(null); setTiles([]); setAnswered(false); setIsCorrect(false);
  };
  /* ข้ามข้อนี้: ไม่เสียหัวใจ ไม่นับว่าตอบผิด สำหรับคนที่ไม่มีเสียงหรือฟังไม่ได้ */
  const handleSkip = () => {
    if (answered) return;
    if (qIndex + 1 >= questions.length) { onComplete(true, mistakes); return; }
    setQIndex((i) => i + 1); setSelected(null); setTiles([]); setAnswered(false); setIsCorrect(false);
  };
  const usedTokIdx = new Set(tiles.map((t) => t.tokIdx));

  return (
    <div className="max-w-md mx-auto">
      <div className="flex items-center gap-3 mb-5">
        <button onClick={onExit} className="text-amber-100/50 hover:text-amber-100 p-1"><X size={20} /></button>
        <div className="flex-1 h-2.5 bg-teal-900 rounded-full overflow-hidden">
          <div className="h-full bg-amber-400 transition-all duration-300" style={{ width: `${(qIndex / questions.length) * 100}%` }} />
        </div>
        <div className="flex items-center gap-1 text-rose-400">
          {[0, 1, 2].map((i) => <Heart key={i} size={18} fill={i < hearts ? "currentColor" : "none"} className={i < hearts ? "" : "text-rose-400/30"} />)}
        </div>
      </div>

      <div className="bg-orange-50 rounded-xl border border-amber-800/20 shadow-md p-6 text-center min-h-[180px] flex flex-col items-center justify-center">
        {q.prompt.glyph && (
          <>
            <p style={thaiFont} className="text-xs text-teal-950/40 mb-3">ตัวอักษรนี้แปลว่าอะไร？</p>
            <p style={zhFont} className="text-6xl font-bold text-teal-950">{q.prompt.glyph}</p>
          </>
        )}
        {q.prompt.audio && !q.prompt.text && (
          <>
            <p style={thaiFont} className="text-xs text-teal-950/40 mb-3">ฟังเสียงแล้วเลือกคำตอบ</p>
            <button onClick={() => speak(q.prompt.audio)} className="p-5 rounded-full bg-teal-950 text-amber-300 active:scale-95 transition"><Volume2 size={28} /></button>
            {!answered && (
              <button onClick={handleSkip} style={thaiFont} className="mt-3 text-xs text-teal-950/40 underline underline-offset-2">
                ฟังไม่ได้? ข้ามข้อนี้
              </button>
            )}
          </>
        )}
        {q.prompt.zh && (
          <>
            <p style={thaiFont} className="text-xs text-teal-950/40 mb-2">ประโยคนี้แปลว่าอะไร？</p>
            <p style={zhFont} className="text-2xl font-bold text-teal-950">{q.prompt.zh}</p>
            <p style={monoFont} className="text-sm text-emerald-800 mt-1">{q.prompt.py}</p>
            <button onClick={() => speak(q.prompt.zh)} style={thaiFont} className="inline-flex items-center gap-1 text-xs text-teal-950/50 mt-2"><Volume2 size={12} /> เล่นเสียง</button>
            <SpeechPracticeButton targetText={q.prompt.zh} />
          </>
        )}
        {q.prompt.text && q.kind !== "p_spell" && (
          <>
            <p style={thaiFont} className="text-xs text-teal-950/40 mb-3">หา{lesson.domain === "char" ? "ตัวอักษร" : "ประโยคภาษาจีน"}ที่ตรงกับความหมายนี้</p>
            <p style={thaiFont} className="text-2xl font-semibold text-teal-950">{q.prompt.text}</p>
          </>
        )}
        {q.kind === "p_spell" && (
          <>
            <p style={thaiFont} className="text-xs text-teal-950/40 mb-2">เรียงพินอินให้ถูกลำดับ</p>
            <p style={thaiFont} className="text-xl font-semibold text-teal-950 mb-1">{q.prompt.text}</p>
            <button onClick={() => speak(q.prompt.audio)} className="inline-flex items-center gap-1 text-xs text-teal-950/50"><Volume2 size={12} /> เล่นเสียง</button>
          </>
        )}
      </div>

      {q.kind === "p_spell" && (
        <div className="mt-4">
          <div className={`min-h-[3rem] rounded-md border-2 px-3 py-2 flex flex-wrap gap-2 items-center ${answered ? (isCorrect ? "border-emerald-600 bg-emerald-50" : "border-rose-600 bg-rose-50") : "border-teal-950/15 bg-white"}`}>
            {tiles.length === 0 && <span style={thaiFont} className="text-teal-950/30 text-sm">แตะปุ่มด้านล่างเพื่อเรียงคำ…</span>}
            {tiles.map((t, i) => <button key={i} onClick={() => removeTile(i)} style={monoFont} className="px-3 py-1.5 rounded-md bg-teal-950 text-amber-200 text-sm">{t.tok}</button>)}
          </div>
          <div className="flex flex-wrap gap-2 mt-3 justify-center">
            {q.tiles.map((tok, i) => (
              <button key={i} disabled={usedTokIdx.has(i) || answered} onClick={() => addTile(tok, i)} style={monoFont} className={`px-3 py-1.5 rounded-md text-sm border-2 transition ${usedTokIdx.has(i) ? "opacity-0 pointer-events-none" : "bg-orange-50 border-amber-800/20 text-teal-950 active:scale-95"}`}>{tok}</button>
            ))}
          </div>
          {!answered && (
            <button onClick={submitSpell} disabled={tiles.length !== q.correctTiles.length} style={thaiFont} className="w-full mt-4 py-3 rounded-md bg-amber-400 disabled:opacity-30 text-teal-950 font-semibold transition active:scale-95">ตรวจคำตอบ</button>
          )}
        </div>
      )}

      {q.kind !== "p_spell" && (
        <div className="grid grid-cols-1 gap-2 mt-4">
          {q.options.map((opt) => {
            let state = "idle";
            if (answered) { if (opt.key === q.correctKey) state = "reveal-correct"; else if (opt.key === selected) state = "selected-wrong"; else state = "dimmed"; }
            return <OptionButton key={opt.key} opt={opt} state={state} onClick={() => handleChoice(opt)} />;
          })}
        </div>
      )}

      {answered && (
        <div className="mt-4">
          <p style={thaiFont} className={`text-sm font-medium flex items-center gap-1.5 ${isCorrect ? "text-emerald-300" : "text-rose-300"}`}>
            {isCorrect ? <><Check size={16} /> ถูกต้อง!</> : <><X size={16} /> ผิด{q.kind === "p_spell" ? `　เฉลย：${q.correctTiles.join(" ")}` : ""}</>}
          </p>
          <button onClick={handleContinue} style={thaiFont} className="w-full mt-2 py-3 rounded-md bg-amber-400 text-teal-950 font-semibold flex items-center justify-center gap-1 active:scale-95 transition">
            {hearts <= 0 ? "ดูผลลัพธ์" : qIndex + 1 >= questions.length ? "จบด่าน" : "ต่อไป"} <ArrowRight size={16} />
          </button>
        </div>
      )}
    </div>
  );
}

function ResultScreen({ success, mistakes, xpEarned, streak, onDone }) {
  return (
    <div className="max-w-md mx-auto text-center py-10">
      <div className={`w-20 h-20 rounded-full mx-auto flex items-center justify-center mb-5 ${success ? "bg-amber-400 text-teal-950" : "bg-teal-900 text-amber-200/50"}`}>
        {success ? <Trophy size={36} /> : <Heart size={36} />}
      </div>
      <h2 style={thaiFont} className="text-2xl font-bold text-orange-50 mb-1">{success ? "ผ่านด่านแล้ว!" : "หัวใจหมดแล้ว"}</h2>
      <p style={thaiFont} className="text-amber-100/60 text-sm mb-6">{success ? (mistakes === 0 ? "ถูกหมดทุกข้อ สมบูรณ์แบบ!" : `ผ่านแล้ว ตอบผิด ${mistakes} ข้อ`) : "ไม่เป็นไร ลองใหม่อีกครั้งนะ"}</p>
      {success && (
        <div className="flex items-center justify-center gap-6 mb-8">
          <div className="flex items-center gap-1.5 text-amber-300"><Zap size={20} /> <span className="font-semibold">+{xpEarned} XP</span></div>
          <div className="flex items-center gap-1.5 text-orange-400"><Flame size={20} /> <span style={thaiFont} className="font-semibold">ต่อเนื่อง {streak} วัน</span></div>
        </div>
      )}
      <button onClick={onDone} style={thaiFont} className="px-8 py-3 rounded-full bg-amber-400 text-teal-950 font-semibold active:scale-95 transition">{success ? "กลับไปที่แผนที่ด่าน" : "ลองใหม่อีกครั้ง"}</button>
    </div>
  );
}

function LessonNode({ lesson, index, status, onClick }) {
  const Icon = TOPIC_ICON[lesson.topic];
  const offset = index % 3 === 1 ? "translate-x-8" : index % 3 === 2 ? "-translate-x-8" : "";
  let circleCls = "bg-teal-900 text-amber-100/20 border-amber-100/10";
  if (status === "current") circleCls = "bg-amber-400 text-teal-950 border-amber-300 shadow-[0_0_0_6px_rgba(251,191,36,0.15)]";
  else if (status === "done") circleCls = "bg-emerald-600 text-white border-emerald-500";
  return (
    <div className={`relative flex flex-col items-center ${offset}`}>
      <button onClick={onClick} disabled={status === "locked"} className={`w-16 h-16 rounded-full border-4 flex items-center justify-center transition active:scale-95 ${circleCls} ${status === "locked" ? "cursor-not-allowed" : ""}`}>
        {status === "locked" ? <Lock size={22} /> : status === "done" ? <Check size={26} /> : lesson.topic === "char" ? <span style={zhFont} className="text-2xl font-bold">{lesson.pool[0].c}</span> : <Icon size={24} />}
      </button>
      <p style={thaiFont} className="text-xs text-amber-100/60 mt-2 text-center max-w-[6.5rem] leading-tight">{lesson.unit}</p>
      <p style={thaiFont} className="text-[10px] text-amber-100/30 text-center max-w-[6.5rem] leading-tight">{lesson.sub}</p>
    </div>
  );
}

function LessonsTab() {
  const [completed, setCompleted] = useState(new Set());
  const [xp, setXp] = useState(0);
  const [streak, setStreak] = useState(0);
  const [direction, setDirection] = useState("mixed");
  const [activeLessonId, setActiveLessonId] = useState(null);
  const [result, setResult] = useState(null);

  useEffect(() => {
    (async () => {
      try { const r = await storageGet("zh-lesson-progress"); if (r?.value) setCompleted(new Set(JSON.parse(r.value))); } catch (e) {}
      try { const r2 = await storageGet("zh-xp-streak"); if (r2?.value) { const d = JSON.parse(r2.value); setXp(d.xp || 0); setStreak(d.streak || 0); } } catch (e) {}
      try { const r3 = await storageGet("zh-lesson-direction"); if (r3?.value) setDirection(r3.value); } catch (e) {}
    })();
  }, []);

  const changeDirection = (d) => { setDirection(d); (async () => { try { await storageSet("zh-lesson-direction", d); } catch (e) {} })(); };
  const activeLesson = LESSONS.find((l) => l.id === activeLessonId);

  const handleComplete = async (success, mistakes) => {
    if (!success) { setResult({ success: false, mistakes, xpEarned: 0 }); return; }
    const earned = mistakes === 0 ? 15 : 10;
    const newCompleted = new Set(completed); newCompleted.add(activeLessonId);
    const today = new Date().toISOString().slice(0, 10);
    let newStreak = streak;
    try {
      const r = await storageGet("zh-xp-streak");
      const prev = r?.value ? JSON.parse(r.value) : { xp: 0, streak: 0, last: null };
      if (prev.last === today) newStreak = prev.streak || streak;
      else if (prev.last) { const diffDays = Math.round((new Date(today) - new Date(prev.last)) / 86400000); newStreak = diffDays === 1 ? (prev.streak || 0) + 1 : 1; }
      else newStreak = 1;
      const newXp = (prev.xp || 0) + earned;
      await storageSet("zh-xp-streak", JSON.stringify({ xp: newXp, streak: newStreak, last: today }));
      setXp(newXp);
    } catch (e) { setXp((x) => x + earned); newStreak = streak || 1; }
    setStreak(newStreak); setCompleted(newCompleted);
    try { await storageSet("zh-lesson-progress", JSON.stringify([...newCompleted])); } catch (e) {}
    setResult({ success: true, mistakes, xpEarned: earned, streak: newStreak });
  };

  if (activeLesson && !result) return <LessonGame lesson={activeLesson} direction={direction} onExit={() => setActiveLessonId(null)} onComplete={handleComplete} />;
  if (result) return <ResultScreen success={result.success} mistakes={result.mistakes} xpEarned={result.xpEarned} streak={result.streak || streak} onDone={() => { setResult(null); setActiveLessonId(null); }} />;

  return (
    <div>
      <div className="flex items-center justify-center gap-6 mb-5">
        <div className="flex items-center gap-1.5 text-amber-300"><Zap size={18} /> <span className="font-semibold text-sm">{xp} XP</span></div>
        <div className="flex items-center gap-1.5 text-orange-400"><Flame size={18} /> <span style={thaiFont} className="font-semibold text-sm">ต่อเนื่อง {streak} วัน</span></div>
      </div>
      <div className="flex items-center justify-center gap-2 mb-8">
        {["zh-th", "th-zh", "mixed"].map((d) => (
          <button key={d} onClick={() => changeDirection(d)} className={`px-3.5 py-1.5 rounded-full text-xs font-medium transition ${direction === d ? "bg-amber-400 text-teal-950" : "bg-teal-900 text-amber-200/70"}`}>{LESSON_DIRECTION_LABEL[d]}</button>
        ))}
      </div>
      <div className="relative flex flex-col items-center gap-8 max-w-xs mx-auto">
        <div className="absolute top-0 bottom-0 left-1/2 w-0.5 bg-amber-100/10 -z-10" />
        {LESSONS.map((lesson, i) => {
          const status = completed.has(lesson.id) ? "done" : (i === 0 || completed.has(LESSONS[i - 1].id)) ? "current" : "locked";
          return <LessonNode key={lesson.id} lesson={lesson} index={i} status={status} onClick={() => status !== "locked" && setActiveLessonId(lesson.id)} />;
        })}
      </div>
    </div>
  );
}

/* 主元件                                                      */

const TABS = [
  { id: "lessons", label: "ด่านบทเรียน", icon: Trophy },
  { id: "write", label: "ฝึกเขียน", icon: PenLine },
  { id: "type", label: "พิมพ์จีน", icon: Keyboard },
  { id: "travel", label: "ท่องเที่ยว", icon: Plane },
  { id: "chat", label: "แชท", icon: MessageCircle },
  { id: "quiz", label: "แบบทดสอบ", icon: GraduationCap },
];

function ChineseFromThai() {
  const [tab, setTab] = useState("lessons");
  const [known, setKnown] = useState(new Set());
  const [knownChars, setKnownChars] = useState(new Set());

  useEffect(() => {
    (async () => {
      try { const res = await storageGet("zh-known-phrases"); if (res?.value) setKnown(new Set(JSON.parse(res.value))); } catch (e) {}
      try { const res2 = await storageGet("zh-known-chars"); if (res2?.value) setKnownChars(new Set(JSON.parse(res2.value))); } catch (e) {}
    })();
  }, []);

  const toggleKnown = async (id) => {
    setKnown((prev) => {
      const next = new Set(prev);
      next.has(id) ? next.delete(id) : next.add(id);
      (async () => { try { await storageSet("zh-known-phrases", JSON.stringify([...next])); } catch (e) {} })();
      return next;
    });
  };
  const toggleKnownChar = async (id) => {
    setKnownChars((prev) => {
      const next = new Set(prev);
      next.has(id) ? next.delete(id) : next.add(id);
      (async () => { try { await storageSet("zh-known-chars", JSON.stringify([...next])); } catch (e) {} })();
      return next;
    });
  };

  return (
    <div className="min-h-screen bg-teal-950" style={thaiFont}>
      <div className="border-b border-amber-100/10 px-5 pt-8 pb-4">
        <p className="text-amber-400 text-xs tracking-[0.3em] uppercase mb-1" style={monoFont}>Pinyin · Zhuyin · 中文</p>
        <h1 style={zhFont} className="text-3xl font-black text-orange-50">แบกเป้ภาษาจีน</h1>
        <p style={thaiFont} className="text-amber-100/60 text-sm mt-1">ด่านบทเรียน・ฝึกเขียน・พิมพ์จีน・ท่องเที่ยว・แชท ครบในที่เดียว</p>
      </div>

      <div className="sticky top-0 z-10 bg-teal-950/95 backdrop-blur border-b border-amber-100/10 px-3 py-2 overflow-x-auto">
        <div className="flex gap-2 min-w-max">
          {TABS.map(({ id, label, icon: Icon }) => (
            <button key={id} onClick={() => setTab(id)} className={`flex items-center gap-1.5 px-4 py-2 rounded-full text-sm font-medium transition ${tab === id ? "bg-amber-400 text-teal-950" : "text-amber-100/60 hover:text-amber-100"}`}>
              <Icon size={15} /> {label}
            </button>
          ))}
        </div>
      </div>

      <div className="px-5 py-6 max-w-3xl mx-auto">
        {tab === "lessons" && <LessonsTab />}
        {tab === "write" && <WritingTab known={knownChars} onToggleKnown={toggleKnownChar} />}
        {tab === "type" && <TypingTab />}
        {tab === "travel" && <PhraseGrid list={TRAVEL} known={known} onToggleKnown={toggleKnown} note="เสียงวรรณยุกต์ (声调) สำคัญมาก ออกเสียงผิดวรรณยุกต์ความหมายอาจเปลี่ยนไปเลย" />}
        {tab === "chat" && <PhraseGrid list={CHAT} known={known} onToggleKnown={toggleKnown} />}
        {tab === "quiz" && <QuizSection known={known} onToggleKnown={toggleKnown} />}
      </div>

      <div className="px-5 pb-8 pt-2 max-w-3xl mx-auto">
        <p style={thaiFont} className="text-xs text-amber-100/30">กดรูปดาวเพื่อบันทึกคำที่จำได้แล้ว ระบบจะบันทึกให้อัตโนมัติ การเล่นเสียงขึ้นอยู่กับว่าอุปกรณ์ของคุณรองรับเสียงภาษาจีนหรือไม่ หากไม่มีเสียง สามารถดูพินอินแทนได้ หรือกด "ข้ามข้อนี้" ในโจทย์ฟังเสียงได้โดยไม่เสียหัวใจ ปุ่ม "ฝึกพูด" ต้องใช้ไมโครโฟนและอินเทอร์เน็ต รองรับดีที่สุดใน Chrome/Edge บนคอมพิวเตอร์ เบราว์เซอร์อื่นจะแสดงเป็นปุ่มปิดใช้งาน คะแนนเป็นเพียงการเทียบข้อความที่ถอดเสียงได้ ไม่ใช่คะแนนความแม่นยำในการออกเสียงจริง ๆ</p>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ChineseFromThai />);
